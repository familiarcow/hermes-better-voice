name: better-voice
version: 1.0.0
author: FamiliarCow
license: MIT
requires_hermes: ">=0.23.0"
description: "Fully local dictation for Hermes Desktop: live word-by-word text, accurate final text, overlapping takes, queued send. No cloud."
provides_transcription_providers:
  - better_voice
provides_tools: []
provides_hooks: []
provides_middleware: []
requires_env: []
python_dependencies:
  - "faster-whisper==1.2.1; (platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or platform_system != 'Darwin') and sys_platform != 'android'"
  - "av==18.1.0; (platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or platform_system != 'Darwin') and sys_platform != 'android'"
  - "numpy==2.5.4; (platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or platform_system != 'Darwin') and sys_platform != 'android'"
